name: Build and deploy WAR app to Azure Web App - clinicalaluz-web

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      # Comprimimos los archivos web tradicionales en un archivo WAR funcional
      - name: Build WAR package
        run: |
          mkdir -p build/webapp
          cp -r WebPages/* build/webapp/ 2>/dev/null || true
          cp -r src/main/webapp/* build/webapp/ 2>/dev/null || true
          cd build/webapp && jar -cvf ../ROOT.war *

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: build/ROOT.war

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
  
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: webapp
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FE606C68E8E1419E8715EAC61A12FA28 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C54195103774451DAA56B3D86275E583 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D479697E499F4CD6BEABA0F244A71412 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'clinicalaluz-web'
          slot-name: 'Production'
          package: 'ROOT.war'
